<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 MIDAS WEEK Photo Gallery</title>
  <meta name="description" content="2026 MIDAS WEEK 단체사진 갤러리" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B8%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <a class="topbar__title" href="#/" aria-label="홈으로">2026 MIDAS WEEK Photo Gallery</a>
    <a class="topbar__ai" href="https://bananapallete.github.io/Global-RPM-Day-Member-Photos/#" target="_blank" rel="noopener noreferrer">
      <span class="ai-full">AI 사진 보러가기</span><span class="ai-short">AI 사진</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M9 7 H17 V15" /></svg>
    </a>
  </header>

  <main id="app"><!-- rendered by app.js --></main>

  <footer class="footer">ⓒ MIDAS IT · 2026 MIDAS WEEK</footer>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" aria-label="닫기">&times;</button>
    <button class="lightbox__nav lightbox__prev" aria-label="이전"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" /></svg></button>
    <img class="lightbox__img" alt="" />
    <button class="lightbox__nav lightbox__next" aria-label="다음"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" /></svg></button>
    <a class="lightbox__download" download>사진 다운로드</a>
    <div class="lightbox__strip" aria-label="폴더 전체 사진 미리보기"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
